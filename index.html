<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eac39c"><link rel="preload" as="image" href="/assets/ui/pause-settings-panel.png"><link rel="preload" as="image" href="/assets/ui/result-panel.png"><link rel="icon" href="data:,"><title>后会友期 · 合成小游戏</title><body><main><header><h1 class="illustrated-title"><img src="/assets/ui/title-plaque.png" alt="我画地为牢啊，厉娜"></h1><div class="edition">旧友旅馆 · 十级道具</div></header><section class="bar" aria-label="分数与控制"><div class="score-card" aria-label="当前分数"><b id="score">0</b></div><div class="score-card best" aria-label="历史最高"><b id="best">0</b></div><button id="pause" aria-label="暂停游戏"><img src="/assets/ui/pause-button.svg" alt=""></button></section><div id="next-live"><img alt="下一件道具"></div><div id="game" aria-label="左右移动或滑动选择位置，点击或松手投放"></div><button id="support-open" type="button" aria-label="赞赏支持，请作者喝杯奶茶"><span class="support-heart" aria-hidden="true">♥</span><span>赞赏支持<small>请作者喝杯奶茶</small></span><span aria-hidden="true">✦</span></button><section id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog"><button id="dialog-close" aria-label="关闭暂停菜单">×</button><div id="result-emblem" aria-hidden="true">♛</div><small>后 会 友 期 · 合 成 小 游 戏</small><h2 id="dialog-title">歇一会儿</h2><img id="result-art" alt="" hidden><div id="result-stats" hidden><div><span>本局得分</span><strong id="result-score"></strong></div><div><span>历史最高</span><strong id="result-best"></strong></div></div><p id="dialog-copy"></p><div class="sound-settings"><label for="sound-volume">音效音量 <output id="sound-value">50%</output></label><input id="sound-volume" type="range" min="0" max="100" step="5" aria-label="音效音量"><label class="mute"><input id="sound-muted" type="checkbox" role="switch"> 静音</label><div class="feedback-options"><label><input id="haptics" type="checkbox" role="switch">手机振动</label><label><input id="reduced-motion" type="checkbox" role="switch">减少动态</label></div></div><button id="resume">▶ 继续收集回忆</button><button id="share-result" type="button" hidden>分享成绩</button><button id="play-again" class="secondary">再来一局</button></div></section></main><dialog id="support-dialog" aria-labelledby="support-title"><div class="support-card"><button id="support-close" type="button" aria-label="关闭赞赏弹窗" autofocus>×</button><h2 id="support-title">谢谢你的支持</h2><p class="support-subtitle">请作者喝杯奶茶，让快乐继续</p><div class="support-code-frame"><div class="support-code-crop"><img id="support-image" alt="作者微信赞赏码" loading="lazy"></div></div><p class="support-tip">微信扫一扫，或保存后在微信中识别</p><a id="support-save" download="赞赏码.png">保存赞赏码</a><small>自愿支持 · 感谢你的喜欢</small></div></dialog><dialog id="share-dialog" aria-labelledby="share-title"><button id="share-close" type="button" aria-label="关闭分享预览" autofocus>×</button><h2 id="share-title">分享我的成绩</h2><p id="share-status" role="status"></p><img id="share-preview" alt="包含本局分数、合成进度与游戏二维码的分享卡" hidden><div class="share-actions"><button id="share-native" type="button" hidden>分享给朋友</button><a id="share-save" hidden>保存分享图</a></div></dialog><script type="module" src="/src/main.js"></script></body></html>
